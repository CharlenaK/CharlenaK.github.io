# Requires "Allow auto-merge" in Settings -> General -> Pull Requests.
# Do not add a checkout step here: pull_request_target runs with write permissions,
# and this workflow must never execute pull-request code.
name: Dependabot Auto Merge

on:
  pull_request_target:
    types: [ opened, synchronize, reopened, labeled, edited ]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Dependabot
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Check auto-merge setting
        run: |
          if [ "$(gh api repos/$GITHUB_REPOSITORY --jq .allow_auto_merge)" != "true" ]; then
            echo "::error::Auto-merge is disabled. Enable it in Settings -> General -> Pull Requests."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
